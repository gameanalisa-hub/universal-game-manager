name: Sync Pixel Worlds announcements
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: sync-pixel-worlds-announcements
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Fetch public Steam announcements
        run: node scripts/sync-events.mjs
      - name: Commit updated feed
        run: |
          if git diff --quiet -- events-feed.json; then
            echo "No announcement changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add events-feed.json
          git commit -m "chore: sync Pixel Worlds event announcements"
          git push
